# Laboratorio VII: Integración Continua de la API de reservas.
# Laboratorio IX: análisis estático con SonarQube Cloud y cobertura de pruebas.

# Ejecutar automáticamente después de cada push a main o develop.
trigger:
  branches:
    include:
      - main
      - develop

# Ejecutar en una máquina Windows hospedada por Microsoft.
pool:
  name: 'Default'

variables:
  frontendDirectory: 'frontend'
  buildConfiguration: 'Release'
  testProject: 'Backend/SistemaReservas.API/SistemaReservas.Tests/SistemaReservas.Tests.csproj'
  # Laboratorio IX: solución completa (API, Application, Domain, Infrastructure y Tests)
  # para que SonarQube analice todas las capas del backend.
  solution: 'Backend/SistemaReservas.API/SistemaReservas.API.slnx'
  # Datos del proyecto en SonarQube Cloud (los mismos del Laboratorio VIII).
  sonarOrganization: 'mazunigaal'
  sonarProjectKey: 'mazunigaal_Laboratorio-OBLD'
  sonarProjectName: 'Laboratorio OBLD'

steps:
  # Obtener el código de la rama que se está ejecutando.
  - checkout: self
    clean: true

  # Instalar el SDK requerido por los proyectos net10.0.
  - task: UseDotNet@2
    displayName: 'Instalar SDK .NET 10'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  # Laboratorio IX - 1. Prepare Analysis Configuration.
  # Debe ir ANTES de compilar: configura SonarScanner for .NET para que el build
  # recolecte la información del análisis. Usa la conexión de servicio "SonarQubeCloud"
  # (token de SonarQube Cloud con permisos Browse y Execute analysis).
  - task: SonarCloudPrepare@3
    displayName: 'SonarQube: preparar configuración del análisis'
    inputs:
      SonarCloud: 'SonarQubeCloud'
      organization: '$(sonarOrganization)'
      scannerMode: 'dotnet'
      projectKey: '$(sonarProjectKey)'
      projectName: '$(sonarProjectName)'
      extraProperties: |
        # Cobertura de pruebas generada por coverlet en formato OpenCover.
        sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/TestResults/**/coverage.opencover.xml
        # Resultados de las pruebas (reporte TRX) para mostrar el total de pruebas.
        sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/TestResults/*.trx
        # Mismas exclusiones de cobertura justificadas en coverlet.runsettings (Taller V).
        sonar.coverage.exclusions=**/Program.cs,**/Migrations/**,**/*Seeder.cs,**/WeatherForecast*.cs
        # Código generado por EF Core: no se analiza.
        sonar.exclusions=**/Migrations/**

  # Restaurar los paquetes de toda la solución.
  - script: dotnet restore "$(solution)"
    displayName: 'Restaurar dependencias'

  # Compilar la solución completa en Release (aquí SonarScanner recolecta el análisis).
  - script: dotnet build "$(solution)" --configuration "$(buildConfiguration)" --no-restore
    displayName: 'Compilar en Release'

  # Ejecutar todas las pruebas, generar el reporte TRX y la cobertura.
  # coverlet.runsettings genera "cobertura" (para ReportGenerator local); aquí se cambia
  # el formato a "opencover", que es el que lee SonarQube, sin modificar el archivo.
  - script: >
      dotnet test "$(testProject)"
      --configuration "$(buildConfiguration)"
      --no-build
      --no-restore
      --logger "trx;LogFileName=resultados.trx"
      --results-directory "$(Agent.TempDirectory)/TestResults"
      --collect "XPlat Code Coverage"
      -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    displayName: 'Ejecutar pruebas unitarias e integración con cobertura'

  # Publicar los resultados incluso si alguna prueba falla.
  - task: PublishTestResults@2
    displayName: 'Publicar reporte de pruebas TRX'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
      failTaskOnFailureToPublishResults: true
      publishRunAttachments: true
      testRunTitle: 'Reservas-Labs - $(Build.BuildNumber)'

  # Laboratorio IX - 2. Run Code Analysis.
  # Procesa lo recolectado en el build y la cobertura, y envía el análisis a SonarQube Cloud.
  - task: SonarCloudAnalyze@3
    displayName: 'SonarQube: ejecutar análisis de código'

  # Laboratorio IX - 3. Publish Quality Gate Result.
  # Espera el resultado del Quality Gate y lo muestra en el resumen del pipeline.
  - task: SonarCloudPublish@3
    displayName: 'SonarQube: publicar resultado del Quality Gate'
    inputs:
      pollingTimeoutSec: '300'

  - task: NodeTool@0
    displayName: 'Instalar Node.js 22'
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: 'Restaurar dependencias del frontend'
    workingDirectory: '$(frontendDirectory)'

  - script: npm test
    displayName: 'Ejecutar pruebas del frontend'
    workingDirectory: '$(frontendDirectory)'

  - script: npm run lint
    displayName: 'Validar lint del frontend'
    workingDirectory: '$(frontendDirectory)'

  - script: npm run build
    displayName: 'Compilar frontend'
    workingDirectory: '$(frontendDirectory)'
